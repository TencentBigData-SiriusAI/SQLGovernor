[project]
name = "sqlgovernor-bird"
version = "1.0.0"
description = "Reproducibility package for the BIRD dev-set evaluation of SQLGovernor"
authors = [
    {name = "SQLGovernor Authors"}
]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "langchain>=0.3.18",
    "langchain-openai>=0.2.14",
    "langgraph>=0.2.62",
    "langchain-core>=0.3.28",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "sqlalchemy>=2.0.36",
    "python-dotenv>=1.0.1",
    "json-repair>=0.29.11",
    "requests>=2.32.3",
    "certifi>=2024.12.14",
    "loguru>=0.7.2",
    "typing-extensions>=4.12.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "isort>=5.13.2",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

